# Ruff configuration for the Stock Forecast Benchmark.
# Notebooks are an intentional standalone showcase (they use print/f-strings
# and relaxed style), so they are excluded from linting.

line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", ".venv", "data/cache"]

[lint]
# E/W = pycodestyle, F = pyflakes (unused imports, undefined names).
select = ["E", "F", "W"]
# Many lines are deliberately long, descriptive comments and aligned columns;
# wrapping them would hurt readability without improving correctness.
ignore = ["E501"]
